<main class="main"><header class="top"><h1>LIVE 6 · Bài tập tính bán kính, độ đặc khít</h1><div class="spacer"></div><span class="pill">XP <b id="xpTop">0</b></span><span class="pill">Đúng <b id="accTop">0%</b></span></header><section class="content">

</section></main></div><div id="modalRoot"></div><div id="toastRoot"></div>
<script>
const NA=6.022e23, PI=3.14;
const modules=[
{id:'m1',icon:'🧩',title:'Độ đặc khít · phần rỗng · đổi đơn vị',focus:'Nhìn đúng P, phần rỗng và đưa bán kính về cm trước khi thay số.',formula:'P = V_nguyên tử / V_tinh thể ; P% + %rỗng = 100%',theory:'Độ đặc khít P cho biết phần thể tích tinh thể thực sự do các nguyên tử hình cầu chiếm. Nếu đề cho phần rỗng x% thì P=(100−x)%.'},
{id:'m2',icon:'📏',title:'Tính bán kính nguyên tử',focus:'Từ M, D và độ đặc khít suy thể tích 1 nguyên tử rồi lấy căn bậc ba.',formula:'M·P / D = (4/3)πr³·Nₐ',theory:'Một mol tinh thể có thể tích M/D. Chỉ phần P của thể tích đó thuộc về các nguyên tử. Chia cho Nₐ để ra thể tích một nguyên tử.'},
{id:'m3',icon:'◉',title:'Tính độ đặc khít',focus:'Biết M, D, r → tính phần thể tích nguyên tử chiếm trong tinh thể.',formula:'P = 4πr³NₐD / (3M)',theory:'So sánh tổng thể tích các nguyên tử trong 1 mol với thể tích 1 mol tinh thể. P phải nằm từ 0 đến 1.'},
{id:'m4',icon:'⚖',title:'Tính khối lượng riêng tinh thể',focus:'Từ bán kính và P suy D; phân biệt khối lượng riêng “hình cầu đặc” với tinh thể thật.',formula:'D = 3MP / (4πr³Nₐ)',theory:'Nếu cùng nguyên tử, tinh thể càng đặc khít thì khối lượng riêng càng lớn. Với cùng M,r: D_tinh thể = D_hình-cầu-đặc × P.'},
{id:'m5',icon:'🔬',title:'Hạt nhân · tỉ lệ thể tích · khối lượng riêng',focus:'So sánh kích thước nguyên tử–hạt nhân và xử lí fm, pm, amu, tấn/cm³.',formula:'%V = (r_hạt nhân/r_nguyên tử)³×100%; ρ = m/V',theory:'Thể tích hình cầu tỉ lệ với r³. Vì bán kính hạt nhân rất nhỏ nên phần thể tích hạt nhân trong nguyên tử cực kì bé dù gần như toàn bộ khối lượng tập trung ở hạt nhân.'},
{id:'m6',icon:'🚀',title:'Tổng hợp nâng cao · sao neutron',focus:'Bài nhiều bước: đổi đơn vị → chọn công thức → suy r/P/D/ρ → kiểm bậc 10.',formula:'V=4πr³/3; m=M/Nₐ; ρ=m/V',theory:'Đây là dạng tổng hợp. Mọi bài đều quay về ba câu hỏi: vật nào chiếm thể tích nào, khối lượng của bao nhiêu hạt, và đơn vị đã thống nhất chưa?'}
];
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)], esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const key='live6_radius_packing_pro_v1';let st=JSON.parse(localStorage.getItem(key)||'null')||{xp:0,attempted:0,correct:0,wrong:[],done:{}};function save(){localStorage.setItem(key,JSON.stringify(st))}
function updateTop(){let acc=st.attempted?Math.round(st.correct/st.attempted*100):0;$('#xpTop').textContent=st.xp;$('#accTop').textContent=acc+'%';$('#wrongBadge').textContent=st.wrong.length}
function toast(t){$('#toastRoot').innerHTML='<div class="toast">'+esc(t)+'</div>';setTimeout(()=>$('#toastRoot').innerHTML='',1800)}function openModal(h){$('#modalRoot').innerHTML='<div class="modalbg" onclick="if(event.target===this)closeModal()"><div class="modal"><button class="btn secondary" style="float:right" onclick="closeModal()">✕</button>'+h+'</div></div>'}function closeModal(){$('#modalRoot').innerHTML=''}
function nav(v){$$('.view').forEach(x=>x.classList.remove('active'));$('#v-'+v).classList.add('active');$$('.nav[data-v]').forEach(x=>x.classList.toggle('active',x.dataset.v===v));if(v==='home')renderHome();if(v==='practice')renderPractice();if(v==='source')renderSource();if(v==='wrong')renderWrong();if(v==='report')renderReport();updateTop();scrollTo({top:0})}
function renderHome(){let acc=st.attempted?Math.round(st.correct/st.attempted*100):0;$('#v-home').innerHTML=`<div class="hero card"><div><span class="tag blue">LIVE 6 · RADIUS & PACKING</span><h2>Bán kính · độ đặc khít · khối lượng riêng</h2><p>Biến mọi bài thành một sơ đồ thể tích duy nhất: <b>M/D → nhân độ đặc khít P → chia Nₐ → thể tích 1 nguyên tử → suy r, P hoặc D.</b></p><div class="memoryStrip"><span>600 câu luyện</span><span>50 cơ bản + 50 nâng cao/dạng</span><span>15 câu gốc từ file</span><span>Enter để check/chuyển</span><span>Tư duy ngược + chữa lỗi 5 bước</span></div><button class="btn primary" onclick="nav('practice')">Bắt đầu luyện</button></div><div class="viz"><div class="formulaCore"><div class="eqrow"><span>1 mol tinh thể</span><strong>V = M/D</strong></div><div class="eqrow"><span>1 mol nguyên tử</span><strong>V = M·P/D</strong></div><div class="eqrow"><span>1 nguyên tử</span><strong>V = M·P/(D·Nₐ)</strong></div><div class="eqrow"><span>Hình cầu</span><strong>V = 4πr³/3</strong></div></div></div></div><div class="grid g4" style="margin-top:15px"><div class="card stat"><strong>${st.attempted}</strong><span>câu đã làm</span></div><div class="card stat"><strong>${acc}%</strong><span>độ chính xác</span></div><div class="card stat"><strong>${st.xp}</strong><span>XP</span></div><div class="card stat"><strong>${st.wrong.length}</strong><span>câu sai cần ôn</span></div></div><div class="card" style="margin-top:15px"><h3>Bản đồ công thức cốt lõi</h3><table class="formula-table"><tr><th>Dạng</th><th>Công thức bật ra</th><th>Câu tự hỏi trước khi tính</th></tr><tr><td>Phần rỗng</td><td class="miniEq">P = 1 − f_rỗng</td><td>Đề cho “chiếm” hay “khe rỗng”?</td></tr><tr><td>Bán kính</td><td class="miniEq">r = ∛[3MP/(4πDNₐ)]</td><td>r đã đổi về cm chưa?</td></tr><tr><td>Đặc khít</td><td class="miniEq">P = 4πr³NₐD/(3M)</td><td>P cuối có nằm 0→1?</td></tr><tr><td>Khối lượng riêng</td><td class="miniEq">D = 3MP/(4πr³Nₐ)</td><td>P đang là % hay số thập phân?</td></tr> function fmt(n,d=2){return Number(n.toFixed(d)).toString()}function fmtSci(n,d=2){return n.toExponential(d).replace('e+','×10^').replace('e-','×10^-')}function rot(arr,k){k=((k%arr.length)+arr.length)%arr.length;return arr.slice(k).concat(arr.slice(0,k))}function mkOpts(correct,vals,seed,formatter=x=>String(x)){let uniq=[correct,...vals].filter((x,i,a)=>a.findIndex(y=>Math.abs(Number(y)-Number(x))<1e-12)===i).slice(0,4);while(uniq.length<4)uniq.push(correct*(1+0.1*uniq.length));let order=rot(uniq,seed%4),a=order.findIndex(x=>Math.abs(Number(x)-Number(correct))<1e-12);return{opts:order.map(formatter),a}}
function baseQ(module,i,adv,text,correct,vals,formatter,expl,rule,trap){let o=mkOpts(correct,vals,i+(adv?2:0),formatter);return{id:`${module}-${adv?'a':'b'}-${i}`,module,level:adv?'Nâng cao':'Cơ bản',text,opts:o.opts,a:o.a,expl,rule,trap,calc:true}}

function rFrom(M,D,P){return Math.cbrt(3*M*P/(4*PI*D*NA))}function pFrom(M,D,r){return 4*PI*r**3*NA*D/(3*M)}function dFrom(M,r,P){return 3*M*P/(4*PI*r**3*NA)}
function m1gen(i,adv){let voids=[26,25,32,28,35,20,40,18,30,27],v=voids[i%voids.length],P=(100-v)/100;if(!adv){if(i%2===0){return baseQ('m1',i,adv,`Trong một tinh thể, phần khe rỗng chiếm ${v}% thể tích. Độ đặc khít P bằng bao nhiêu?`,P,[P+.05,P-.05,v/100],x=>(x*100).toFixed(1).replace('.0','')+'%',`Độ đặc khít và phần rỗng cộng lại bằng 100%, nên P=${100-v}%.`,'P = 1 − phần rỗng','Đừng lấy P bằng chính phần rỗng.')}let m=metals[i%metals.length],V=m[1]/m[2];return baseQ('m1',i,adv,`Kim loại ${m[0]} có M=${m[1]} g/mol và D=${m[2]} g/cm³. Thể tích của 1 mol tinh thể xấp xỉ bao nhiêu cm³?`,V,[V*.9,V*1.1,V/NA],x=>fmt(x,2)+' cm³',`V₁mol tinh thể=M/D=${m[1]}/${m[2]}≈${fmt(V,2)} cm³.`,'V₁mol tinh thể = M/D','Chưa nhân P ở bước này: đây là thể tích toàn tinh thể.')}else{let m=metals[i%metals.length];if(i%2===0){let Vmol=m[1]/m[2]*m[3];return baseQ('m1',i,adv,`Với ${m[0]}, M=${m[1]} g/mol, D=${m[2]} g/cm³ và P=${(m[3]*100).toFixed(1)}%. Tổng thể tích thực sự do 1 mol nguyên tử chiếm là bao nhiêu cm³?`,Vmol,[m[1]/m[2],Vmol/m[3]*.5,Vmol*1.1],x=>fmt(x,2)+' cm³',`Lấy thể tích 1 mol tinh thể M/D rồi nhân P: V=${fmt(Vmol,2)} cm³.`,'V₁mol nguyên tử = (M/D)·P','P phải đổi từ % sang số thập phân.')}let A=[1.2,1.35,1.44,1.28][i%4],cm=A*1e-8;return baseQ('m1',i,adv,`${A} Å bằng bao nhiêu cm?`,cm,[A*1e-7,A*1e-9,A*1e-10],x=>x.toExponential(2)+' cm',`1 Å=10⁻⁸ cm nên ${A} Å=${A}×10⁻⁸ cm.`,'1 Å = 10⁻⁸ cm','Sai 1 bậc ở r sẽ sai 3 bậc ở r³.')}}
function m2gen(i,adv){let m=metals[i%metals.length],M=m[1],D=m[2],P=m[3],r=rFrom(M,D,P),ang=r/1e-8;if(!adv){return baseQ('m2',i,adv,`Giả sử nguyên tử ${m[0]} là hình cầu, M=${M} g/mol, D=${D} g/cm³ và độ đặc khít ${(P*100).toFixed(1)}%. Bán kính gần đúng là bao nhiêu Å?`,ang,[ang*.9,ang*1.1,ang*1.25],x=>fmt(x,2)+' Å',`Từ M·P/D=(4/3)πr³Nₐ suy r≈${fmt(ang,2)} Å.`,'r = ∛[3MP/(4πDNₐ)]','Phải đổi P về số thập phân và r cuối từ cm sang Å.')}else{let unit=i%3;if(unit===0){let pm=ang*100;return baseQ('m2',i,adv,`Với dữ kiện M=${M} g/mol, D=${D} g/cm³, P=${(P*100).toFixed(1)}%, bán kính nguyên tử ${m[0]} gần bằng bao nhiêu pm?`,pm,[pm*.8,pm*1.2,ang],x=>fmt(x,1)+' pm',`Tính r theo công thức rồi đổi 1 Å=100 pm. r≈${fmt(pm,1)} pm.`,'r = ∛[3MP/(4πDNₐ)]','Đừng nhầm 1 Å = 10 pm; đúng là 100 pm.')}if(unit===1){let Vmol=M/D;return baseQ('m2',i,adv,`Một mol tinh thể ${m[0]} chiếm ${fmt(Vmol,2)} cm³; các nguyên tử chiếm ${(P*100).toFixed(1)}% thể tích. Bán kính nguyên tử gần bằng bao nhiêu Å?`,ang,[ang*.75,ang*1.15,ang*1.35],x=>fmt(x,2)+' Å',`V nguyên tử/mol=${fmt(Vmol*P,2)} cm³. Chia Nₐ rồi lấy căn bậc ba để được r≈${fmt(ang,2)} Å.`,'V₁ nguyên tử=(V_mol·P)/Nₐ','Tách rõ thể tích tinh thể và thể tích nguyên tử.')}let voidp=(1-P)*100;return baseQ('m2',i,adv,`Tinh thể ${m[0]} có phần rỗng ${fmt(voidp,1)}%, M=${M} g/mol, D=${D} g/cm³. Bán kính gần đúng là bao nhiêu Å?`,ang,[ang*.85,ang*1.1,ang*1.3],x=>fmt(x,2)+' Å',`Phần rỗng ${fmt(voidp,1)}% ⇒ P=${fmt(P*100,1)}%. Sau đó dùng công thức bán kính.`,'P=1−f_rỗng; r = ∛[3MP/(4πDNₐ)]','Phần rỗng không phải P.')}}
function m3gen(i,adv){let m=metals[(i+2)%metals.length],M=m[1],D=m[2],P=m[3],r=rFrom(M,D,P);if(!adv){let p=pFrom(M,D,r);return baseQ('m3',i,adv,`Kim loại ${m[0]} có M=${M} g/mol, D=${D} g/cm³, bán kính r=${fmt(r/1e-8,3)} Å. Độ đặc khít gần bằng bao nhiêu?`,p,[p-.08,p+.08,1-p],x=>fmt(x*100,1)+'%',`P=4πr³NₐD/(3M)≈${fmt(p*100,1)}%.`,'P = 4πr³NₐD/(3M)','r phải dùng cm; P phải nằm 0–100%.')}else{let variant=i%2;if(variant===0){let rr=r/1e-7;return baseQ('m3',i,adv,`Bán kính ${m[0]} là ${fmt(rr,4)} nm, M=${M} g/mol, D=${D} g/cm³. Phần khe rỗng gần bằng bao nhiêu %?`,1-P,[P,1-P+.05,1-P-.05],x=>fmt(x*100,1)+'%',`Đổi nm→cm, tính P≈${fmt(P*100,1)}%, rồi phần rỗng=100%−P≈${fmt((1-P)*100,1)}%.`,'f_rỗng = 1 − P','Câu hỏi hỏi phần rỗng, không hỏi P.')}let rr=r/1e-10;return baseQ('m3',i,adv,`Với r=${fmt(rr,1)} pm, M=${M} g/mol và D=${D} g/cm³, độ đặc khít của ${m[0]} gần bằng bao nhiêu %?`,P,[P*.85,P*1.1,1-P],x=>fmt(x*100,1)+'%',`1 pm=10⁻¹⁰ cm. Thay vào công thức P cho kết quả ≈${fmt(P*100,1)}%.`,'P = 4πr³NₐD/(3M)','Sai đổi pm→cm làm P sai tới 10⁶ lần.')}}
function m4gen(i,adv){let m=metals[(i+4)%metals.length],M=m[1],P=m[3],r=rFrom(M,m[2],P),D=dFrom(M,r,P);if(!adv){return baseQ('m4',i,adv,`Nguyên tử ${m[0]} có r=${fmt(r/1e-8,3)} Å, M=${M} g/mol và chiếm ${(P*100).toFixed(1)}% thể tích tinh thể. Khối lượng riêng gần bằng bao nhiêu g/cm³?`,D,[D*.8,D*1.2,D/P],x=>fmt(x,2)+' g/cm³',`D=3MP/(4πr³Nₐ)≈${fmt(D,2)} g/cm³.`,'D = 3MP/(4πr³Nₐ)','Nếu bỏ P, em đang tính “khối cầu đặc”, không phải tinh thể thật.')}else{if(i%2===0){let Dsolid=dFrom(M,r,1);return baseQ('m4',i,adv,`Nếu coi các hình cầu ${m[0]} xếp kín hoàn toàn (P=100%), khối lượng riêng hình-cầu-đặc là ${fmt(Dsolid,2)} g/cm³. Với P=${fmt(P*100,1)}%, khối lượng riêng tinh thể thật gần bằng?`,D,[Dsolid,D/P,D*.9],x=>fmt(x,2)+' g/cm³',`D_tinh thể=D_đặc×P=${fmt(Dsolid,2)}×${fmt(P,3)}≈${fmt(D,2)} g/cm³.`,'D_tinh thể = D_đặc × P','P=74% phải dùng 0,74.')}let D2=D*.95,r2=r*Math.cbrt(D/D2);return baseQ('m4',i,adv,`Một mẫu ${m[0]} có cùng M và P nhưng khối lượng riêng giảm còn ${fmt(D2,2)} g/cm³. Theo mô hình hình cầu, bán kính hiệu dụng sẽ gần bằng bao nhiêu Å?`,r2/1e-8,[r/1e-8,(r2/1e-8)*.9,(r2/1e-8)*1.1],x=>fmt(x,3)+' Å',`Vì r³∝1/D nên r tăng theo căn bậc ba của D_cũ/D_mới.`,'r ∝ D^(-1/3) khi M,P không đổi','Không suy r tỉ lệ nghịch tuyến tính với D.')}}
function m5gen(i,adv){if(!adv){let rn=[2.7,3.0,3.5,4.0][i%4]*1e-15,ra=[70,80,90,100][i%4]*1e-12,p=(rn/ra)**3*100;return baseQ('m5',i,adv,`Bán kính hạt nhân là ${fmt(rn/1e-15,1)} fm, bán kính nguyên tử là ${fmt(ra/1e-12,0)} pm. Hạt nhân chiếm khoảng bao nhiêu % thể tích nguyên tử?`,p,[p*10,p/10,(rn/ra)*100],x=>x.toExponential(2)+'%',`Vì cùng là hình cầu nên tỉ lệ thể tích bằng (r_hn/r_nt)³. Kết quả cực nhỏ: ${p.toExponential(2)}%.`,'%V=(r_hn/r_nt)³×100%','Phải đổi fm và pm về cùng đơn vị trước khi lập tỉ số.')}else{if(i%2===0){let A=[27,56,65,197][i%4],r=[1.8,2.0,2.1,2.5][i%4]*1e-13,m=A*1.6605e-24,rho=m/(4/3*PI*r**3),t=rho/1e6;return baseQ('m5',i,adv,`Hạt nhân có số khối A=${A}, bán kính ${fmt(r/1e-13,1)}×10⁻¹³ cm. Xem toàn bộ khối lượng A amu nằm trong hạt nhân. Khối lượng riêng gần bằng bao nhiêu tấn/cm³?`,t,[t/10,t*10,t/1e6],x=>x.toExponential(2)+' tấn/cm³',`m≈A×1,6605×10⁻²⁴ g; V=4πr³/3; ρ=m/V rồi chia 10⁶ để đổi g/cm³→tấn/cm³.`,'ρ = A·1,6605×10⁻²⁴ /[(4/3)πr³]','1 tấn =10⁶ g.')}let k=1.5e-13,rho=1.6605e-24/(4/3*PI*k**3),t=rho/1e6;return baseQ('m5',i,adv,`Biết bán kính hạt nhân tuân theo r = 1,5×10⁻¹³·A^(1/3) cm. Theo mô hình này, khối lượng riêng hạt nhân phụ thuộc A như thế nào?`,t,[t*2,t/2,t*10],x=>x.toExponential(2)+' tấn/cm³',`m∝A còn V∝r³∝A, nên A triệt tiêu. ρ≈${t.toExponential(2)} tấn/cm³, gần như không phụ thuộc A.`,'r∝A^(1/3) ⇒ V∝A ⇒ ρ≈hằng số','Đừng giữ A sau khi đã lập r³.')}}
function m6gen(i,adv){if(!adv){let units=[['1,25 Å',1.25e-8],['0,135 nm',1.35e-8],['128 pm',1.28e-8],['2,0 fm',2e-13]],u=units[i%units.length];return baseQ('m6',i,adv,`${u[0]} tương ứng gần bằng bao nhiêu cm?`,u[1],[u[1]*10,u[1]/10,u[1]*100],x=>x.toExponential(2)+' cm',`Đổi đúng tiền tố về cm trước khi tính.`,'Å=10⁻⁸ cm; nm=10⁻⁷ cm; pm=10⁻¹⁰ cm; fm=10⁻¹³ cm','Không được trộn đơn vị m với cm trong cùng công thức.')}else{if(i%2===0){let rn=1e-13,R=0.01,mn=1.675e-24,rho=mn/(4/3*PI*rn**3),mkg=rho*(4/3*PI*R**3)/1000;return baseQ('m6',i,adv,`Coi neutron là hình cầu bán kính 1,0×10⁻¹³ cm, khối lượng 1,675×10⁻²⁴ g. Một mảnh vật chất có cùng khối lượng riêng và bán kính 0,1 mm sẽ có khối lượng xấp xỉ bao nhiêu kg?`,mkg,[mkg/1000,mkg*1000,mkg/10],x=>x.toExponential(2)+' kg',`Tính ρ_neutron rồi nhân thể tích hình cầu R=0,1 mm=10⁻² cm. Kết quả ≈${mkg.toExponential(2)} kg.`,'m = ρ·(4/3)πR³','0,1 mm = 10⁻² cm, không phải 10⁻¹ cm.')}let M=[40,56,65,108][i%4],r=[1.3,1.4,1.35,1.44][i%4]*1e-8,P=[.68,.74,.725,.75][i%4],D=dFrom(M,r,P);let rUp=r*1.1,Dnew=dFrom(M,rUp,P);return baseQ('m6',i,adv,`Giữ M và P không đổi. Nếu bán kính nguyên tử tăng 10% từ ${fmt(r/1e-8,2)} Å lên ${fmt(rUp/1e-8,2)} Å, khối lượng riêng thay đổi từ ${fmt(D,2)} xuống gần bao nhiêu g/cm³?`,Dnew,[D*.9,D/1.1,D/(1.1**2)],x=>fmt(x,2)+' g/cm³',`D∝1/r³, nên D_mới=D_cũ/(1,1)³≈${fmt(Dnew,2)} g/cm³.`,'D ∝ r⁻³ khi M,P không đổi','Tăng r 10% không làm D giảm 10%; ảnh hưởng theo lũy thừa 3.')}}

let quiz={list:[],idx:0,sel:null,checked:false,title:''};function startModule(mid,mode){let list=BANK.filter(q=>q.module===mid&&(mode==='all'||(mode==='basic'?q.level==='Cơ bản':q.level==='Nâng cao')));quiz={list,idx:0,sel:null,checked:false,title:modules.find(m=>m.id===mid).title};navQuiz()}function startSourceAll(){quiz={list:sourceQuestions,idx:0,sel:null,checked:false,title:'Câu gốc LIVE 6'};navQuiz()}function startOneSource(i){quiz={list:[sourceQuestions[i]],idx:0,sel:null,checked:false,title:'Câu gốc LIVE 6'};navQuiz()}function navQuiz(){$$('.view').forEach(x=>x.classList.remove('active'));$('#v-quiz').classList.add('active');renderQuiz();scrollTo({top:0})}
function reverseThinking(q){let m=q.module;if(m==='m1')return{goal:'Xác định P, phần rỗng hoặc thể tích mol.',chain:'Đáp án ← P hoặc V ← 100%−rỗng / M÷D ← dữ kiện',steps:['Khoanh từ khóa “chiếm” hay “khe rỗng”.','Nếu có M,D thì tính V_mol=M/D.','Chỉ nhân P khi cần thể tích thật do nguyên tử chiếm.'],trap:'Phần rỗng và độ đặc khít là hai phần bù nhau.'};if(m==='m2')return{goal:'Tìm bán kính r.',chain:'r ← V₁ nguyên tử ← V₁mol nguyên tử ← M/D và P',steps:['Tính V₁mol tinh thể=M/D.','Nhân P, rồi chia Nₐ.','Dùng V=4πr³/3 và lấy căn bậc ba.'],trap:'Sau khi ra r(cm), đổi sang Å/nm/pm theo yêu cầu.'};if(m==='m3')return{goal:'Tìm độ đặc khít P hoặc phần rỗng.',chain:'P ← V_nguyên tử/V_tinh thể ← r³,Nₐ,M,D',steps:['Đổi r về cm.','Tính thể tích 1 mol nguyên tử từ r.','Chia cho M/D; nếu hỏi rỗng lấy 1−P.'],trap:'P phải trong [0,1]. Nếu >1, gần như chắc chắn sai đơn vị.'};if(m==='m4')return{goal:'Tìm khối lượng riêng D.',chain:'D ← M·P / V₁mol nguyên tử ← r³,Nₐ',steps:['Đổi r về cm.','Tính V₁mol nguyên tử=(4/3)πr³Nₐ.','D=M·P/V₁mol nguyên tử.'],trap:'P=1 chỉ khi coi các hình cầu lấp đầy 100% thể tích.'};if(m==='m5')return{goal:'So sánh thể tích hoặc tính ρ hạt nhân.',chain:'%V/ρ ← r³ và m ← đổi đơn vị + A·amu',steps:['Đưa hai bán kính về cùng đơn vị.','V dùng r³ nên giữ bậc 10 cẩn thận.','Nếu tính ρ: m≈A×1,6605×10⁻²⁴ g.'],trap:'fm và pm chênh nhau 10³ lần về độ dài, tức 10⁹ lần về thể tích.'};return{goal:'Giải bài tổng hợp nhiều bước.',chain:'Đại lượng cuối ← ρ hoặc D/P/r ← V hình cầu ← đơn vị chuẩn',steps:['Ghi đơn vị cạnh từng dữ kiện.','Chọn công thức chứa đúng đại lượng cần tìm.','Kiểm lại bậc 10 và tính hợp lí của kết quả.'],trap:'Bài sao neutron thường sai ở mm→cm hoặc g→kg.'}}
function analysisHTML(q){if(!q.calc)return'';let r=reverseThinking(q);return `<details class="analysisBox" open><summary>🧠 Phân tích đề · Tư duy ngược</summary><div class="analysisBody"><div class="analysisGrid"><div class="analysisCard"><h4>1. Đề đang hỏi gì?</h4><p>${r.goal}</p><h4>2. Công thức bật ra</h4><p>${esc(q.rule||modules.find(m=>m.id===q.module).formula)}</p></div><div class="analysisCard reverse"><h4>↩ Tư duy ngược</h4><div class="analysisArrow">${r.chain}</div><ol class="analysisSteps">${r.steps.map(x=>`<li>${x}</li>`).join('')}</ol></div></div><div class="analysisHint"><b>Bẫy cần kiểm:</b> ${r.trap}</div></div></details>`}
function renderQuiz(){let q=quiz.list[quiz.idx];if(!q){nav('home');return}let srcTag=q.source?'<span class="tag amber">Từ file LIVE 6</span>':'';$('#v-quiz').innerHTML=`<div class="qwrap"><div class="pagehead"><div><h2>${esc(quiz.title)}</h2><p>Câu ${quiz.idx+1}/${quiz.list.length} · Enter để kiểm tra/chuyển câu</p></div><button class="btn secondary" onclick="nav('practice')">← Thoát</button></div><div class="card"><div class="qmeta"><span class="tag blue">${esc(q.level)}</span>${srcTag}<span class="tag purple">${esc(modules.find(m=>m.id===q.module).title)}</span></div><div class="qtext">${esc(q.text)}</div>${analysisHTML(q)}<div id="opts">${q.opts.map((o,i)=>`<button class="opt ${quiz.sel===i?'sel':''}" onclick="choose(${i})"><span class="letter">${'ABCD'[i]}</span><span>${esc(o)}</span></button>`).join('')}</div><div id="fb"></div><div class="actionsRow"><button class="btn secondary" ${quiz.idx===0?'disabled':''} onclick="move(-1)">← Trước</button><div style="display:flex;gap:8px"><button class="btn primary" id="checkBtn" onclick="check()">Kiểm tra</button><button class="btn secondary" onclick="move(1)">Sau →</button></div></div></div></div>`}
function choose(i){if(quiz.checked)return;quiz.sel=i;renderQuiz()}function check(){let q=quiz.list[quiz.idx];if(quiz.checked){move(1);return}if(quiz.sel===null){toast('Chọn một đáp án trước');return}quiz.checked=true;let ci=q.a,ok=quiz.sel===ci;st.attempted++;if(ok){st.correct++;st.xp+=10}else{st.xp+=2;if(!st.wrong.some(x=>x.id===q.id))st.wrong.push({...q,chosen:quiz.sel})}st.done[q.module]=Math.min(100,(st.done[q.module]||0)+(ok?2:.5));save();updateTop();$$('.opt').forEach((b,i)=>{if(i===ci)b.classList.add('ok');if(i===quiz.sel&&!ok)b.classList.add('bad');b.disabled=true});$('#fb').innerHTML=`<div class="feedback ${ok?'explain':'warning'}"><h3>${ok?'✓ Chính xác':'✗ Chưa đúng'}</h3><div class="answerCompare"><div class="answerPill ${ok?'good':'bad'}"><b>Em chọn</b><br>${esc(q.opts[quiz.sel])}</div><div class="answerPill good"><b>Đáp án đúng</b><br>${esc(q.opts[ci])}</div></div><p><b>Vì sao?</b> ${esc(q.expl)}</p><p><b>Công thức / quy tắc:</b> ${esc(q.rule)}</p><p><b>Bẫy dễ sai:</b> ${esc(q.trap)}</p>${!ok?`<button class="btn purpleBtn" onclick="openGap('${q.module}')">Mở 5 câu tìm lỗ hổng</button>`:''}</div>`;$('#checkBtn').textContent='Câu tiếp →'}
function move(d){let ni=quiz.idx+d;if(ni<0)return;if(ni>=quiz.list.length){toast('Đã hoàn thành bộ câu hỏi');nav('report');return}quiz.idx=ni;quiz.sel=null;quiz.checked=false;renderQuiz();scrollTo({top:0})}document.addEventListener('keydown',e=>{if(e.key==='Enter'&&$('#v-quiz').classList.contains('active')){e.preventDefault();check()}})

function openGap(mid){let qs=diag[mid];openModal(`<span class="tag purple">Chữa lỗi 5 bước</span><h2>Tự tìm lỗ hổng · ${modules.find(m=>m.id===mid).title}</h2><p class="muted">Chọn đáp án cho từng câu. Mục tiêu là phát hiện chính xác mắt xích vừa nhầm.</p>${qs.map((q,qi)=>`<div class="diagq"><b>Bước ${qi+1}/5</b><p>${q[0]}</p><div class="diagopts">${q[1].map((o,oi)=>`<button class="diagopt" onclick="diagChoose(this,${oi},${q[2]})">${'ABCD'[oi]}. ${o}</button>`).join('')}</div></div>`).join('')}`)}function diagChoose(btn,i,a){let box=btn.closest('.diagopts');[...box.children].forEach(x=>x.disabled=true);btn.classList.add(i===a?'good':'bad');if(i!==a)box.children[a].classList.add('good')}
function renderWrong(){let a=st.wrong;$('#v-wrong').innerHTML=`<div class="pagehead"><div><h2>Sổ câu sai</h2><p>Mỗi lỗi được giữ lại để luyện đúng mắt xích kiến thức.</p></div><button class="btn secondary" onclick="if(confirm('Xóa sổ câu sai?')){st.wrong=[];save();renderWrong();updateTop()}">Xóa sổ</button></div>${a.length?a.map((q,i)=>`<div class="wrongitem"><span class="tag red">Lỗi ${i+1}</span><h3>${esc(q.text)}</h3><p><b>Đáp án đúng:</b> ${esc(q.opts[q.a])}</p><p><b>Quy tắc cần ôn:</b> ${esc(q.rule)}</p><button class="btn purpleBtn" onclick="openGap('${q.module}')">Luyện 5 bước</button></div>`).join(''):'<div class="card"><h3>Chưa có câu sai 🎯</h3><p class="muted">Làm bài để hệ thống tự xây sổ lỗi.</p></div>'}`}
function renderReport(){let acc=st.attempted?Math.round(st.correct/st.attempted*100):0;$('#v-report').innerHTML=`<div class="pagehead"><div><h2>Báo cáo tiến độ</h2><p>Dữ liệu lưu ngay trên trình duyệt bằng localStorage.</p></div></div><div class="grid g4"><div class="card stat"><strong>${st.attempted}</strong><span>câu đã làm</span></div><div class="card stat"><strong>${acc}%</strong><span>độ chính xác</span></div><div class="card stat"><strong>${st.xp}</strong><span>XP</span></div><div class="card stat"><strong>${st.wrong.length}</strong><span>câu sai cần ôn</span></div></div><div class="card" style="margin-top:15px"><h3>Mastery theo dạng</h3>${modules.map(m=>`<div style="margin:13px 0"><div style="display:flex;justify-content:space-between"><b>${m.icon} ${m.title}</b><span>${Math.round(st.done[m.id]||0)}%</span></div><div class="progress"><span style="width:${Math.min(100,st.done[m.id]||0)}%"></span></div></div>`).join('')}</div>`}
genBank();updateTop();renderHome();
</script></body></html>
